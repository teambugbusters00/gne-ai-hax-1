<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GenAI Hackathon Copilot</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;background:#101522;color:#eef}textarea,input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:9px}button{background:#7c9cff;border:0}pre{white-space:pre-wrap;background:#202a3b;padding:14px}</style><h1>GenAI Hackathon Copilot</h1><input id="api" value="https://genai-hackathon-copilot-api.onrender.com"><textarea id="prompt" placeholder="Evaluation prompt"></textarea><textarea id="response" placeholder="Candidate response"></textarea><button onclick="go()">Evaluate</button><pre id="out"></pre><script>async function go(){let r=await fetch(api.value+'/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt.value,response:response.value})});out.textContent=JSON.stringify(await r.json(),null,2)}</script></html>
